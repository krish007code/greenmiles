[project]
name = "greenmiles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krish007code", email = "kavyanshkumarbaghel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
greenmiles = "greenmiles:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
